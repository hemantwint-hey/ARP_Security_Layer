# ===== Database (Dev - Local MySQL) =====
spring.datasource.url=jdbc:mysql://localhost:3306/arp_privacy_db?createDatabaseIfNotExist=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ===== JPA =====
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# ===== Flyway =====
spring.flyway.enabled=true

# ===== Redis =====
spring.data.redis.host=localhost
spring.data.redis.port=6379

# ===== Kafka =====
spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.producer.acks=all

# ===== ARP Kafka Consumer Groups =====
arp.kafka.gateway-group=arp-gateway-group
arp.kafka.insight-resolver-group=arp-insight-resolver-group
arp.kafka.guard-sync-group=arp-guard-sync-group
arp.kafka.metric-group=arp-metric-group

# ===== ARP Crypto (use strong random keys in prod) =====
arp.crypto.aes-secret-key=change-me-32-char-aes-key-dev-00
arp.crypto.hmac-salt=change-me-hmac-salt-dev-000000000

# ===== Spring AI Internal Service URL =====
arp.ai-service.base-url=http://localhost:8083

# ===== Logging =====
logging.level.org.example.arp_ecurity_layer=DEBUG
logging.level.org.springframework.kafka=WARN
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.orm.jdbc.bind=TRACE

